<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11141c" media="(prefers-color-scheme: dark)" />
    <title>DilGO — Oku, dinle, konuş, yaz. İngilizce tek uygulamada.</title>
    <meta name="description" content="Bayrak Dil Okulları'nın oyunlaştırılmış İngilizce platformu: hikayelerle okuma ve dinleme, AI öğretmen Defne ile konuşma ve yazma, seriler, ligler ve gerçek canlı ders ödülleri." />
    <meta property="og:title" content="DilGO — Dört beceri, tek uygulama" />
    <meta property="og:description" content="Hikayelerle oku ve dinle, AI öğretmen Defne ile konuş ve yaz. Bayrak Dil Okulları güvencesiyle." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <script>
      // apply saved theme before paint to avoid flashes
      try {
        var t = localStorage.getItem('dilgo.theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Boot splash: paints before the bundle parses, removed once React mounts. -->
    <div id="boot" aria-label="DilGO yükleniyor">
      <div class="boot-mark">
        <svg viewBox="0 0 48 48" width="40" height="40" aria-hidden>
          <rect width="48" height="48" rx="14" fill="#E8403A" />
          <path d="M14 12h8.5c7.7 0 12.5 4.9 12.5 12s-4.8 12-12.5 12H14z" fill="#fff" />
          <circle cx="24" cy="24" r="4.2" fill="#E8403A" />
        </svg>
      </div>
      <div class="boot-bar"><i></i></div>
      <p class="boot-text">dilgo</p>
    </div>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: #f7f8fa;
        font-family: ui-rounded, system-ui, sans-serif;
        transition: opacity 0.35s ease;
      }
      html.dark #boot { background: #11141c; }
      #boot.done { opacity: 0; pointer-events: none; }
      .boot-mark {
        display: grid;
        place-items: center;
        animation: boot-pop 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .boot-bar {
        width: 132px;
        height: 6px;
        border-radius: 99px;
        background: rgba(31, 36, 51, 0.1);
        overflow: hidden;
      }
      html.dark .boot-bar { background: rgba(255, 255, 255, 0.12); }
      .boot-bar i {
        display: block;
        height: 100%;
        width: 45%;
        border-radius: 99px;
        background: #e8403a;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      .boot-text {
        margin: 0;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #9aa1b2;
      }
      @keyframes boot-pop { from { transform: scale(0.7); opacity: 0 } to { transform: scale(1); opacity: 1 } }
      @keyframes boot-slide { 0% { transform: translateX(-110%) } 100% { transform: translateX(240%) } }
      @media (prefers-reduced-motion: reduce) { .boot-mark, .boot-bar i { animation: none } }
    </style>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
